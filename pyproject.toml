[project]
name = "opsreport"
version = "0.3.0"
description = "Weekly portfolio operations reporting: reconciliation breaks, AUM, and Jira ops-ticket SLAs."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
