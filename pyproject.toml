[project]
name = "opsreport"
version = "0.3.0"
description = "Weekly portfolio operations reporting: reconciliation breaks, AUM, and Jira ops-ticket SLAs."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["opsreport"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["opsreport"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
